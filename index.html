<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Игрок — база</title>
    <link rel="stylesheet" href="src/ui/style.css" />
  </head>
  <body>
    <div id="overlay">
      <h1>Игрок — база</h1>
      <p>
        W A S D — движение, мышь — обзор, Shift — бег, Esc — отпустить курсор.
        Tab — открыть редактор лабиринта. В редакторе 1 — стена, 0 — стереть, S
        — старт.
      </p>
      <button id="startBtn">Начать</button>
    </div>
    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="src/core/game-config.js"></script>
    <script src="src/render/texture-system.js"></script>
    <script src="src/core/level-utils.js"></script>
    <script src="src/render/scene.js"></script>
    <script src="src/world/maze-level2.js"></script>
    <script src="src/world/level-registry.js"></script>
    <script src="src/core/runtime-loader.js"></script>
  </body>
</html>
